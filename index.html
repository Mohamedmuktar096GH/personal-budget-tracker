<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Budget & Expense Tracker</title>
    <!-- Linking our CSS file so we can style it later -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MAIN HEADER SECTION -->
    <header>
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <!-- PART 2: ADD EXPENSE SECTION -->
    <section class="add-expense-container">
        <h2>Add New Expense</h2>
        
        <!-- Input for Expense Name -->
        <div class="input-group">
            <label for="expense-name">Expense Name:</label>
            <input type="text" id="expense-name" placeholder="e.g., Groceries">
        </div>

        <!-- Input for Amount -->
        <div class="input-group">
            <label for="expense-amount">Amount ($):</label>
            <input type="number" id="expense-amount" placeholder="0.00">
        </div>

        <!-- Dropdown Selector for Category -->
        <div class="input-group">
            <label for="expense-category">Category:</label>
            <select id="expense-category">
                <option value="">-- Select a Category --</option>
                <option value="food">Food & Dining</option>
                <option value="rent">Rent & Housing</option>
                <option value="utilities">Utilities</option>
                <option value="entertainment">Entertainment</option>
                <option value="other">Other</option>
            </select>
        </div>

        <!-- A basic button to finish the static look -->
        <button type="button">Add Expense</button>
    </section>

    <!-- PART 3: YOUR EXPENSES PLACEHOLDER SECTION -->
    <section class="expenses-list-container">
        <h2>Your Expenses</h2>
        <p class="placeholder-text">No expenses yet.</p>
    </section>

</body>
</html>
